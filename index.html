<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول متابعة تكتات التكنو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2236;
    --accent: #00d4ff;
    --text: #e2e8f0;
    --muted: #64748b;
    --today: #00d4ff22;
    --today-border: #00d4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Cairo', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    background-image:
      radial-gradient(ellipse at 20% 20%, #00d4ff08 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #ff6b3508 0%, transparent 50%);
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; color: var(--accent); text-shadow: 0 0 20px #00d4ff55; }
  header p { color: var(--muted); margin-top: 6px; font-size: 0.9rem; }
  .header-widgets { display:flex; justify-content:center; align-items:stretch; flex-wrap:wrap; gap:12px; margin:16px auto 0; max-width:700px; }
  .header-widget { display:flex; align-items:center; gap:12px; min-width:220px; padding:12px 16px; border:1px solid #ffffff14; border-radius:16px; background:linear-gradient(145deg,var(--surface),var(--card)); box-shadow:0 8px 24px #0003; text-align:right; }
  .widget-icon { font-size:1.5rem; }
  .widget-label { display:block; color:var(--muted); font-size:.75rem; }
  #liveClock, #weatherValue { display:block; color:var(--text); font-size:1.1rem; font-weight:700; }
  #liveDate, #weatherAttribution { display:block; color:var(--muted); font-size:.7rem; }
  #weatherBtn { border:1px solid #00d4ff55; border-radius:10px; background:#00d4ff12; color:var(--accent); padding:7px 10px; font:inherit; font-size:.75rem; cursor:pointer; white-space:nowrap; }
  #weatherBtn:hover { background:#00d4ff22; }
  #weatherBtn:disabled { opacity:.65; cursor:wait; }
  @media(max-width:520px) { .header-widgets { gap:8px; } .header-widget { flex:1 1 100%; min-width:0; justify-content:center; } }

  /* ---- فلاتر ---- */
  .filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 18px; max-width: 820px; margin-left: auto; margin-right: auto; }
  .filter-btn { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid #ffffff15; border-radius: 40px; padding: 8px 20px; font-size: 0.88rem; font-family: 'Cairo', sans-serif; font-weight: 700; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { border-color: #ffffff30; color: var(--text); transform: translateY(-1px); }
  .filter-btn.active { color: #000; border-color: transparent; box-shadow: 0 4px 14px #0006; }
  .filter-btn .btn-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .filter-btn.active-0 { background: #00d4ff; }
  .filter-btn.active-1 { background: #a78bfa; }
  .filter-btn.active-2 { background: #34d399; }
  .filter-btn.active-3 { background: #fb923c; }
  .filter-btn.active-all { background: var(--accent); }
  .count-badge { display: none; background: #00000030; border-radius: 20px; padding: 1px 8px; font-size: 0.72rem; }
  .filter-btn.active .count-badge { display: inline-block; }

  /* ---- جدول ---- */
  table { width: 100%; max-width: 820px; margin: 0 auto; border-collapse: separate; border-spacing: 0 6px; }
  thead th { background: var(--card); padding: 12px 16px; font-size: 0.8rem; color: var(--muted); font-weight: 700; text-align: center; }
  thead th:first-child { border-radius: 10px 0 0 10px; }
  thead th:last-child  { border-radius: 0 10px 10px 0; }
  tbody tr { transition: transform 0.15s, opacity 0.2s; }
  tbody tr:hover { transform: scale(1.005); }
  tbody tr.hidden { display: none; }
  tbody td { background: var(--surface); padding: 12px 16px; text-align: center; font-size: 0.88rem; border-top: 1px solid #ffffff06; border-bottom: 1px solid #ffffff06; }
  tbody td:first-child { border-radius: 10px 0 0 10px; border-right: 3px solid transparent; }
  tbody td:last-child { border-radius: 0 10px 10px 0; }
  tr.today td { background: var(--today); }
  tr.today td:first-child { border-right: 3px solid var(--today-border); }

  /* ---- today animated border ---- */
  .today-row-wrap { position: relative; max-width: 820px; margin: 0 auto 6px; border-radius: 12px; padding: 2px; background: transparent; }
  .today-row-wrap::before { content: ''; position: absolute; inset: 0; border-radius: 12px; padding: 2px; background: conic-gradient(from var(--angle, 0deg), transparent 0%, transparent 30%, var(--row-color, #00d4ff) 45%, #ffffff 50%, var(--row-color, #00d4ff) 55%, transparent 70%, transparent 100%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: row-spin 3s linear infinite; z-index: 2; }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes row-spin { to { --angle: 360deg; } }
  .today-row-wrap table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; overflow: hidden; position: relative; z-index: 3; }
  .today-row-wrap table td { border-radius: 0 !important; }
  .today-row-wrap table td:first-child { border-radius: 8px 0 0 8px !important; }
  .today-row-wrap table td:last-child  { border-radius: 0 8px 8px 0 !important; }
  .today-badge { display: inline-block; background: var(--accent); color: #000; font-size: 0.65rem; font-weight: 900; padding: 2px 7px; border-radius: 20px; margin-right: 6px; vertical-align: middle; }

  /* ---- حلقة متحركة حول رقم اليوم الحالي ---- */
  .day-num-ring {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-weight: 900;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--surface);
    z-index: 1;
  }
  @property --ring-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .day-num-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    padding: 2.5px;
    background: conic-gradient(from var(--ring-angle, 0deg), transparent 0%, transparent 25%, var(--ring-color, var(--accent)) 45%, #ffffff 50%, var(--ring-color, var(--accent)) 55%, transparent 75%, transparent 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: ring-spin 3s linear infinite;
  }
  .day-num-ring::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    animation: ring-pulse 2.4s ease-in-out infinite;
  }
  @keyframes ring-spin { to { --ring-angle: 360deg; } }
  @keyframes ring-pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ring-color, var(--accent)) 45%, transparent); }
    50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--ring-color, var(--accent)) 0%, transparent); }
  }

  .emp-0 { color: #00d4ff; font-weight: 700; }
  .emp-1 { color: #a78bfa; font-weight: 700; }
  .emp-2 { color: #34d399; font-weight: 700; }
  .emp-3 { color: #fb923c; font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  .dot-0 { background: #00d4ff; }
  .dot-1 { background: #a78bfa; }
  .dot-2 { background: #34d399; }
  .dot-3 { background: #fb923c; }
  .day-name { color: var(--muted); font-size: 0.78rem; }
  .day-num  { font-weight: 700; font-size: 1rem; }
  .date-str { color: #94a3b8; font-size: 0.78rem; direction: ltr; display: inline-block; }
  .emp-cell { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .hint-pointer {
    position: absolute;
    top: 50%;
    left: calc(100% + 6px);
    transform: translateY(-50%);
    font-size: 1.05rem;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.35));
  }
  .hint-pointer.active {
    animation: hint-click 1.8s ease-out forwards;
  }
  @keyframes hint-click {
    0% { opacity: 0; transform: translateY(-50%) translateX(-8px) scale(.8); }
    12% { opacity: 1; transform: translateY(-50%) translateX(-8px) scale(1); }
    60% { opacity: 1; transform: translateY(-50%) translateX(8px) scale(1); }
    100% { opacity: 0; transform: translateY(-50%) translateX(18px) scale(.9); }
  }
  .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--emp-color, #00d4ff); pointer-events: none; animation: float-particle 3s ease-in-out infinite; opacity: 0; }
  .particle:nth-child(1) { top:-12px;right:10%;animation-delay:0s;animation-duration:2.8s }
  .particle:nth-child(2) { top:-8px;left:20%;animation-delay:.6s;animation-duration:3.2s }
  .particle:nth-child(3) { bottom:-12px;right:30%;animation-delay:1.2s;animation-duration:2.6s }
  .particle:nth-child(4) { bottom:-8px;left:15%;animation-delay:1.8s;animation-duration:3.4s }
  @keyframes float-particle { 0%{opacity:0;transform:translateY(0) scale(.5)} 30%{opacity:1;transform:translateY(-6px) scale(1)} 70%{opacity:1;transform:translateY(-10px) scale(.8)} 100%{opacity:0;transform:translateY(-16px) scale(.3)} }
  @keyframes row-in { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:translateX(0)} }
  tbody tr { animation: row-in 0.35s ease both; }

  .past-toggle-wrap { display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-bottom:18px }
  .previous-month-toggle{border-color:#00d4ff35;color:#8deaff}
  .previous-month-toggle.showing{border-color:#00d4ff88;color:#b6f2ff;background:#00d4ff12}
  .past-toggle-btn { display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid #ffffff18;border-radius:40px;padding:9px 22px;font-size:0.86rem;font-family:'Cairo',sans-serif;font-weight:700;color:var(--muted);cursor:pointer;transition:all 0.25s }
  .past-toggle-btn:hover { border-color:#ffffff35;color:var(--text);transform:translateY(-2px);box-shadow:0 6px 20px #00000040 }
  .past-toggle-btn.showing { border-color:#f87171aa;color:#fca5a5;background:#7f1d1d22 }
  .past-toggle-btn .toggle-icon { font-size:1rem;transition:transform 0.35s ease }
  .past-toggle-btn.showing .toggle-icon { transform:rotate(180deg) }
  tr.past td { opacity:0.45;background:#0d1220 }
  tr.past td:first-child { border-right-color:#ffffff10 }
  .past-label { display:inline-block;background:#ffffff12;color:var(--muted);font-size:0.6rem;font-weight:700;padding:1px 6px;border-radius:20px;margin-right:5px;vertical-align:middle }
  .month-sep td { background:transparent!important;border:none!important;padding:6px 0!important }
  .month-sep-line { display:flex;align-items:center;gap:10px;color:var(--muted);font-size:0.75rem;font-weight:700;padding:0 16px }
  .month-sep-line::before,.month-sep-line::after { content:'';flex:1;height:1px;background:#ffffff15 }
  @keyframes fade-in-row { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  tr.past.revealed td { animation:fade-in-row 0.3s ease both }
  #emptyMsg { display:none;text-align:center;color:var(--muted);padding:32px;font-size:0.9rem }

  @media(max-width:600px){ .stats-grid{grid-template-columns:repeat(2,1fr)} }

  /* ---- ملائمة جدول التكنو لعرض شاشة الجوال دون تغيير شكله ---- */
  @media (max-width: 640px) {
    #monthView table { table-layout: fixed; width: 100%; border-spacing: 0 5px; }
    #monthView thead th { padding: 8px 3px; font-size: 0.66rem; }
    #monthView thead th:nth-child(1) { width: 13%; }
    #monthView thead th:nth-child(2) { width: 20%; }
    #monthView thead th:nth-child(3) { width: 27%; }
    #monthView thead th:nth-child(4) { width: 40%; }

    #tableBody td {
      padding: 8px 5px;
      font-size: 0.78rem;
      word-break: break-word;
    }
    #tableBody .day-name,
    #tableBody .date-str { font-size: 0.66rem; }
    #tableBody .emp-cell { font-size: 0.8rem; gap: 3px; flex-wrap: wrap; justify-content: center; }
    #tableBody .dot { width: 6px; height: 6px; margin-left: 3px; }
    #tableBody .today-badge { font-size: 0.58rem; padding: 1px 5px; }
    #tableBody .past-label { font-size: 0.52rem; padding: 1px 4px; }
    .day-num-ring { width: 26px; height: 26px; font-size: 0.8rem; }

    .today-row-wrap table td { padding: 8px 5px !important; font-size: 0.78rem; }
    .today-row-wrap table td:first-child { width: 15% !important; }
    .today-row-wrap table td:nth-child(2) { width: 22% !important; }
    .today-row-wrap table td:nth-child(3) { width: 27% !important; }
    .today-row-wrap table td:last-child { width: 36% !important; }
  }

  /* ---- خلفية تفاعلية ---- */
  #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body > *:not(#bgCanvas):not(#loadingScreen):not(#snowCanvas):not(#snowToggle) { position: relative; z-index: 1; }

  /* ---- شاشة مقدمة (Splash) بالشعار ---- */
  #loadingScreen {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #loadingScreen.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loadingLogo {
    width: min(64vw, 300px);
    filter: drop-shadow(0 0 26px #00d4ff33);
    animation: logo-pulse 2.2s ease-in-out infinite;
  }
  @keyframes logo-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.03); opacity: 0.92; }
  }
  #loadingBarTrack {
    position: relative;
    width: min(64vw, 300px);
    height: 4px;
    border-radius: 20px;
    background: #ffffff10;
    overflow: hidden;
  }
  #loadingBarFill {
    height: 100%; width: 0%;
    border-radius: 20px;
    background: linear-gradient(90deg, #00d4ff, #a78bfa, #34d399, #fb923c, #00d4ff);
    background-size: 300% 100%;
    box-shadow: 0 0 12px #00d4ff66;
    animation: loading-gradient 1.8s linear infinite;
    transition: width 0.25s ease, opacity 0.4s ease;
  }
  @keyframes loading-gradient { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }

  /* ---- ثيم الشتاء ---- */
  :root { --frost: #bfeaff; }
  body {
    background-image:
      radial-gradient(ellipse at 50% -10%, #bfeaff14 0%, transparent 55%),
      radial-gradient(ellipse at 20% 20%, #00d4ff08 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #a78bfa0a 0%, transparent 50%);
  }
  header h1 {
    background: linear-gradient(180deg, #ffffff 0%, var(--frost) 45%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: none; filter: drop-shadow(0 0 14px #00d4ff44);
  }
  .today-row-wrap::after {
    content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 3px;
    border-radius: 0 0 6px 6px; z-index: 4;
    background: linear-gradient(90deg, transparent, #ffffffcc, transparent);
    filter: blur(.5px); pointer-events: none;
  }
  #snowCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
  #snowToggle {
    position: fixed; bottom: 16px; left: 16px; z-index: 6;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card); border: 1.5px solid #bfeaff40; color: var(--frost);
    font-size: 1.1rem; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center;
  }
  #snowToggle:hover { transform: translateY(-2px); border-color: #bfeaff99; }
  #snowToggle.off { opacity: .5; filter: grayscale(1); }
  #snowToggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>

<script>
const loaderStart = performance.now();

/* ---- شريط التحميل المتدرج أسفل الشعار ---- */
const loadingScreen = document.getElementById('loadingScreen');
const loadingBarFill = document.getElementById('loadingBarFill');
let loaderProgress = 20;
if (loadingBarFill) loadingBarFill.style.width = loaderProgress + '%';
const loaderTicker = setInterval(() => {

/* =========================================================
   خلفية تفاعلية — شبكة جزيئات متصلة تتفاعل مع الماوس/اللمس
========================================================= */
(function initBackground(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  const isSmall = window.innerWidth < 640;
  const COUNT = isSmall ? 32 : 65;
  const LINK_DIST = isSmall ? 105 : 130;
  const mouse = { x: null, y: null, radius: isSmall ? 90 : 140 };

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  const rand = (min,max) => Math.random()*(max-min)+min;

  class Particle {
    constructor(){
      this.x = rand(0,w); this.y = rand(0,h);
      this.vx = rand(-0.15,0.15); this.vy = rand(-0.15,0.15);
      this.r = rand(1,2.2);
      this.color = Math.random() > 0.55 ? '0,212,255' : '167,139,250';
    }
    update(){
      this.x += this.vx; this.y += this.vy;
      if(this.x < 0 || this.x > w) this.vx *= -1;
      if(this.y < 0 || this.y > h) this.vy *= -1;
      if(mouse.x !== null){
        const dx = this.x - mouse.x, dy = this.y - mouse.y;
        const dist = Math.hypot(dx,dy);
        if(dist < mouse.radius && dist > 0.01){
          const force = (mouse.radius - dist)/mouse.radius;
          this.x += (dx/dist) * force * 1.1;
          this.y += (dy/dist) * force * 1.1;
        }
      }
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${this.color},0.55)`;
      ctx.fill();
    }
  }

  for(let i=0;i<COUNT;i++) particles.push(new Particle());

  function connect(){
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.hypot(dx,dy);
        if(dist < LINK_DIST){
          ctx.strokeStyle = `rgba(0,212,255,${0.12*(1-dist/LINK_DIST)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }

  function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => { p.update(); p.draw(); });
    connect();
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
  window.addEventListener('touchmove', e => {
    if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, { passive: true });
  window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
})();

/* =========================================================
   رذاذ الثلج — ثلاث طبقات عمق، رياح تتبع الماوس/اللمس
========================================================= */
(function initSnow(){
  const canvas = document.getElementById('snowCanvas');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('snowToggle');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, flakes = [], wind = 0, targetWind = 0, raf = null, t = 0;
  let on = !reduceMotion;
  try { const s = localStorage.getItem('snow'); if (s) on = s === 'on'; } catch(e){}

  const LAYERS = [
    { r:[.8,1.5],  v:[.35,.7],  a:.35, sway:.25, wind:.4 },
    { r:[1.4,2.4], v:[.7,1.2],  a:.6,  sway:.45, wind:.8 },
    { r:[2.3,3.6], v:[1.2,1.9], a:.9,  sway:.7,  wind:1.3 },
  ];
  const rand = (a,b) => Math.random()*(b-a)+a;

  function makeFlake(layer, anywhere){
    const L = LAYERS[layer];
    return { L, x: rand(0,w), y: anywhere ? rand(0,h) : rand(-30,-5),
      r: rand(...L.r), v: rand(...L.v), ph: rand(0, Math.PI*2), fr: rand(.4,1.1) };
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const total = Math.min(150, Math.round(w*h/13000));
    flakes = [];
    for(let i=0;i<total;i++){
      const layer = i % 10 < 5 ? 0 : (i % 10 < 8 ? 1 : 2);
      flakes.push(makeFlake(layer, true));
    }
  }
  function frame(){
    t += 0.016;
    wind += (targetWind - wind) * 0.03;
    ctx.clearRect(0,0,w,h);
    for(const f of flakes){
      f.y += f.v;
      f.x += Math.sin(t*f.fr + f.ph) * f.L.sway + wind * f.L.wind;
      if(f.y > h + 8 || f.x < -20 || f.x > w + 20){
        Object.assign(f, makeFlake(LAYERS.indexOf(f.L), false));
      }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(235,248,255,${f.L.a})`;
      ctx.fill();
      if(f.r > 2.3){
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r*2.2, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(191,234,255,.10)';
        ctx.fill();
      }
    }
    raf = requestAnimationFrame(frame);
  }
  function start(){ if(!raf) raf = requestAnimationFrame(frame); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = null; } ctx.clearRect(0,0,w,h); }
  function apply(){
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-pressed', on);
    on ? start() : stop();
  }
  btn.addEventListener('click', () => {
    on = !on;
    try { localStorage.setItem('snow', on ? 'on' : 'off'); } catch(e){}
    apply();
  });
  window.addEventListener('mousemove', e => { targetWind = (e.clientX / w - .5) * 1.6; });
  window.addEventListener('touchmove', e => {
    if(e.touches[0]) targetWind = (e.touches[0].clientX / w - .5) * 1.6;
  }, { passive:true });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
    else if(on) start();
  });
  resize();
  apply();
})();

const now   = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const monthNames=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const currentYear=today.getFullYear(),currentMonth=today.getMonth();
const previousMonthDate=new Date(currentYear,currentMonth-1,1);
const previousYear=previousMonthDate.getFullYear(),previousMonth=previousMonthDate.getMonth();
const daysInMonth=(year,month)=>new Date(year,month+1,0).getDate();
document.title=`جدول متابعة تكتات التكنو - ${monthNames[currentMonth]} ${currentYear}`;
document.querySelector('header p').textContent=`جدول ${monthNames[currentMonth]} ${currentYear} | التناوب اليومي للموظفين`;

const clockFormatter = new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, numberingSystem:'latn' });
const dateFormatter = new Intl.DateTimeFormat('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', numberingSystem:'latn' });
function updateLocalClock() {
  const localNow = new Date();
  document.getElementById('liveClock').textContent = clockFormatter.format(localNow);
  document.getElementById('liveDate').textContent = dateFormatter.format(localNow);
}
updateLocalClock();
setInterval(updateLocalClock, 1000);

const weatherButton = document.getElementById('weatherBtn');
const weatherValue = document.getElementById('weatherValue');
let weatherCoordinates = null;
async function loadCurrentTemperature(latitude, longitude) {
  weatherValue.textContent = 'جارٍ جلب الحرارة...';
  const params = new URLSearchParams({ latitude, longitude, current:'temperature_2m', timezone:'auto' });
  const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
  if (!response.ok) throw new Error('weather request failed');
  const weather = await response.json();
  const temperature = weather.current && weather.current.temperature_2m;
  if (typeof temperature !== 'number') throw new Error('temperature unavailable');
  weatherValue.textContent = `${Math.round(temperature)}°C`;
}
weatherButton.addEventListener('click', () => {
  if (!navigator.geolocation) {
    weatherValue.textContent = 'الموقع غير مدعوم في هذا المتصفح';
    return;
  }
  if (weatherCoordinates) {
    loadCurrentTemperature(weatherCoordinates.latitude, weatherCoordinates.longitude)
      .catch(() => { weatherValue.textContent = 'تعذر جلب الحرارة، حاول مجددًا'; });
    return;
  }
  weatherButton.disabled = true;
  weatherValue.textContent = 'بانتظار إذن الموقع...';
  navigator.geolocation.getCurrentPosition(async position => {
    weatherCoordinates = { latitude:position.coords.latitude, longitude:position.coords.longitude };
    try {
      await loadCurrentTemperature(weatherCoordinates.latitude, weatherCoordinates.longitude);
    } catch {
      weatherValue.textContent = 'تعذر جلب الحرارة، حاول مجددًا';
    } finally {
      weatherButton.disabled = false;
    }
  }, error => {
    weatherValue.textContent = error.code === 1 ? 'يلزم السماح بالموقع لعرض الحرارة' : 'تعذر تحديد الموقع، حاول مجددًا';
    weatherButton.disabled = false;
  }, { enableHighAccuracy:false, timeout:10000, maximumAge:900000 });
});
document.getElementById('previousMonthToggleLabel').textContent=`عرض ${monthNames[previousMonth]} (غير محتسب)`;

// المرساة: 1 أغسطس 2026 = سيد أحمد (فهرس 0)، والتناوب مستمر يومياً بلا انقطاع، تُستخدم لحساب أي تاريخ
const anchorAug = new Date(2026, 7, 1);
function empForDate(d) {
  const diff = Math.round((d - anchorAug) / 86400000);
  return (((diff % 4) + 4) % 4);
}

// ---- بناء جدول الشهر ----
const tbody = document.getElementById('tableBody');
function buildRow(date, day, monthStr, empIdx, isToday, isPast, excludeCount) {
  const emp = employees[empIdx];
  const dow = date.getDay();
  const dateStr = monthStr + String(day).padStart(2,'0');
  if (isToday) {
    const wrapper = document.createElement('tr');
    wrapper.dataset.emp = empIdx; wrapper.dataset.day = day;
    if (excludeCount) { wrapper.dataset.excludeCount = '1'; wrapper.classList.add('previous-month','hidden'); }
    wrapper.classList.add('today');
    const tdWrap = document.createElement('td');
    tdWrap.colSpan = 4;
    tdWrap.style.cssText = 'padding:0;background:transparent;border:none';
    tdWrap.innerHTML = `
      <div class="today-row-wrap" style="--row-color:${emp.color};cursor:pointer" onclick="window.open('https://teknocore.qi.iq','_blank')">
        <table><tr>
          <td style="width:48px"><span class="day-num-ring" style="--ring-color:${emp.color}">${day}</span></td>
          <td style="width:90px"><div class="day-name">${dayNames[dow]}</div></td>
          <td><div class="date-str">${dateStr}</div></td>
          <td><span class="emp-cell ${emp.cls}" style="--emp-color:${emp.color}">
            <span class="particle" style="--emp-color:${emp.color}"></span>
            <span class="particle" style="--emp-color:${emp.color}"></span>
            <span class="particle" style="--emp-color:${emp.color}"></span>
            <span class="particle" style="--emp-color:${emp.color}"></span>
            <span class="today-badge">اليوم</span>
            <span class="dot ${emp.dot}"></span>${emp.name}${excludeCount?'<span class="past-label" title="لا يُحتسب في عدد الأيام" style="margin-right:4px">غير محتسب</span>':''}
          </span></td>
        </tr></table>
      </div>`;
    wrapper.appendChild(tdWrap);
    tbody.appendChild(wrapper);
  } else {
    const tr = document.createElement('tr');
    tr.dataset.emp = empIdx; tr.dataset.day = day;
    if (excludeCount) { tr.dataset.excludeCount = '1'; tr.classList.add('previous-month','hidden'); }
    if (isPast) { tr.classList.add('hidden'); tr.classList.add('past'); }
    tr.style.cursor = 'pointer';
    tr.onclick = () => window.open('https://teknocore.qi.iq','_blank');
    tr.innerHTML = `
      <td class="day-num">${day}</td>
      <td><div class="day-name">${dayNames[dow]}</div></td>
      <td><div class="date-str">${dateStr}</div></td>
      <td><span class="emp-cell ${emp.cls}" style="--emp-color:${emp.color}">
        ${isPast?'<span class="past-label">مضى</span>':''}
        <span class="dot ${emp.dot}"></span>${emp.name}${excludeCount?'<span class="past-label" title="لا يُحتسب في عدد الأيام" style="margin-right:4px">غير محتسب</span>':''}
      </span></td>`;
    tbody.appendChild(tr);
  }
}

// الشهر السابق كاملًا، مطوي افتراضيًا وغير محتسب في عدّادات الموظفين.
const previousMonthSep = document.createElement('tr');
previousMonthSep.className = 'month-sep previous-month hidden';
previousMonthSep.dataset.previousMonthSep = '1';
previousMonthSep.innerHTML=`<td colspan="4"><div class="month-sep-line">${monthNames[previousMonth]} ${previousYear} — أيام سابقة غير محتسبة</div></td>`;
tbody.appendChild(previousMonthSep);
const previousMonthPrefix=`${previousYear}/${String(previousMonth+1).padStart(2,'0')}/`;
for(let day=1;day<=daysInMonth(previousYear,previousMonth);day++){
  const date=new Date(previousYear,previousMonth,day);
  buildRow(date,day,previousMonthPrefix,empForDate(date),date.getTime()===today.getTime(),date<today,true);
}
const sepTr = document.createElement('tr');
sepTr.className = 'month-sep';
sepTr.dataset.sep='1';
sepTr.innerHTML=`<td colspan="4"><div class="month-sep-line">${monthNames[currentMonth]} ${currentYear}</div></td>`;
tbody.appendChild(sepTr);

// يعرض الشهر الحالي حسب تاريخ الجهاز ويحافظ على تناوب الموظفين المستمر.
const currentMonthPrefix=`${currentYear}/${String(currentMonth+1).padStart(2,'0')}/`;
for(let day=1;day<=daysInMonth(currentYear,currentMonth);day++){
  const date=new Date(currentYear,currentMonth,day);
  buildRow(date,day,currentMonthPrefix,empForDate(date),date.getTime()===today.getTime(),date<today,false);
}

function startHintClickAnimation() {
  const target = document.querySelector('#tableBody tr.today .emp-cell');
  if (!target) return;

  const hint = document.createElement('span');
  hint.className = 'hint-pointer';
  hint.innerHTML = '👆';
  target.appendChild(hint);

  const playHint = () => {
    hint.classList.remove('active');
    void hint.offsetWidth;
    hint.classList.add('active');
  };

  setTimeout(playHint, 1000);
  setInterval(playHint, 10000);
}
startHintClickAnimation();

// ---- فلاتر ----
const counts=[0,0,0,0];
document.querySelectorAll('#tableBody tr:not(.month-sep)').forEach(tr=>{
  if(tr.dataset.emp!==undefined && tr.dataset.excludeCount!=='1') counts[+tr.dataset.emp]++;
});
const filtersDiv=document.getElementById('filters');
let activeFilter=-1;
const allBtn=document.createElement('button');
allBtn.className='filter-btn active active-all';
allBtn.innerHTML=`<span class="btn-dot" style="background:#00d4ff"></span> الكل`;
allBtn.onclick=()=>setFilter(-1,allBtn);
filtersDiv.appendChild(allBtn);
const empBtns=[];
employees.forEach((emp,i)=>{
  const btn=document.createElement('button');
  btn.className='filter-btn';
  btn.innerHTML=`<span class="btn-dot" style="background:${emp.color}"></span>${emp.name}<span class="count-badge">${counts[i]} أيام</span>`;
  btn.onclick=()=>setFilter(i,btn);
  filtersDiv.appendChild(btn);
  empBtns.push(btn);
});
function setFilter(idx,clickedBtn){
  activeFilter=idx;
  allBtn.className='filter-btn';
  empBtns.forEach(b=>b.className='filter-btn');
  if(idx===-1) allBtn.className='filter-btn active active-all';
  else clickedBtn.className=`filter-btn active active-${idx}`;
  let visible=0;
  document.querySelectorAll('#tableBody tr:not(.month-sep)').forEach(tr=>{
    const isPast=tr.classList.contains('past');
    const isPreviousMonth=tr.classList.contains('previous-month');
    const match=idx===-1||+tr.dataset.emp===idx;
    const show=match&&(isPreviousMonth?showPreviousMonth:(!isPast||showPast));
    tr.classList.toggle('hidden',!show);
    if(show) visible++;
  });
  document.getElementById('emptyMsg').style.display=visible===0?'block':'none';
}
let showPreviousMonth=false;
function togglePreviousMonth(){
  showPreviousMonth=!showPreviousMonth;
  const btn=document.getElementById('previousMonthToggleBtn');
  const lbl=document.getElementById('previousMonthToggleLabel');
  btn.classList.toggle('showing',showPreviousMonth);
  lbl.textContent=showPreviousMonth?`إخفاء ${monthNames[previousMonth]} السابق`:`عرض ${monthNames[previousMonth]} (غير محتسب)`;
  document.querySelectorAll('#tableBody tr.previous-month').forEach((tr,i)=>{
    if(tr.classList.contains('month-sep')){tr.classList.toggle('hidden',!showPreviousMonth);return;}
    const match=activeFilter===-1||+tr.dataset.emp===activeFilter;
    const show=showPreviousMonth&&match;
    tr.classList.toggle('hidden',!show);
    if(show){tr.classList.add('revealed');tr.style.animationDelay=(i*0.025)+'s';setTimeout(()=>tr.classList.remove('revealed'),600);}
  });
  const visible=[...document.querySelectorAll('#tableBody tr:not(.month-sep)')].filter(tr=>!tr.classList.contains('hidden')).length;
  document.getElementById('emptyMsg').style.display=visible===0?'block':'none';
}
let showPast=false;
function togglePast(){
  showPast=!showPast;
  const btn=document.getElementById('pastToggleBtn');
  const lbl=document.getElementById('pastToggleLabel');
  if(showPast){
    btn.classList.add('showing'); lbl.textContent='إخفاء الأيام السابقة';
    document.querySelectorAll('#tableBody tr.past:not(.previous-month)').forEach((tr,i)=>{
      const isSep=tr.dataset.sep==='1';
      const match=isSep||activeFilter===-1||+tr.dataset.emp===activeFilter;
      if(match){ tr.classList.remove('hidden'); tr.classList.add('revealed'); tr.style.animationDelay=(i*0.04)+'s'; setTimeout(()=>tr.classList.remove('revealed'),600); }
    });
  } else {
    btn.classList.remove('showing'); lbl.textContent='عرض الأيام السابقة';
    document.querySelectorAll('#tableBody tr.past:not(.previous-month)').forEach(tr=>tr.classList.add('hidden'));
  }
}

// ---- إخفاء شاشة التحميل بعد اكتمال بناء الجدول (بحد أدنى لوقت العرض) ----
(function hideLoader(){
  const MIN_LOADER_TIME = 900;
  const elapsed = performance.now() - loaderStart;
  const wait = Math.max(0, MIN_LOADER_TIME - elapsed);
  setTimeout(() => {
    clearInterval(loaderTicker);
    if (loadingBarFill) loadingBarFill.style.width = '100%';
    setTimeout(() => {
      if (loadingScreen) loadingScreen.classList.add('done');
    }, 250);
  }, wait);
})();
</script>
